name: immich-v2-complete
services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:v3.4.0
    command:
    - start.sh
    - immich
    volumes:
    - ${IMMICH_UPLOAD_DIR:-./data/upload}:/usr/src/app/upload
    - /etc/localtime:/etc/localtime:ro
    env_file: []
    environment:
    - DB_HOSTNAME=immich_postgres
    - DB_USERNAME=${IMMICH_DB_USER:-immich}
    - DB_PASSWORD=${DB_PASSWORD}
    - DB_DATABASE_NAME=immich
    - REDIS_HOSTNAME=immich_redis
    - IMMICH_MACHINE_LEARNING_ENABLED=true
    - IMMICH_MACHINE_LEARNING_URL=http://immich-machine-learning:3003
    - MACHINE_LEARNING_WORKERS=3
    - MACHINE_LEARNING_WORKER_TIMEOUT=120
    - DB_VECTOR_EXTENSION=vectorchord
    ports:
    - target: 2283
      published: '2283'
      protocol: tcp
    depends_on:
    - immich-redis
    - immich-postgres
    - immich-machine-learning
    restart: unless-stopped
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:v3.4.0
    volumes:
    - model-cache:/cache
    env_file: []
    restart: unless-stopped
  immich-postgres:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.2.0
    environment:
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    - POSTGRES_USER=${IMMICH_DB_USER:-immich}
    - POSTGRES_DB=immich
    - POSTGRES_INITDB_ARGS=--data-checksums
    volumes:
    - ./data/pgdata:/var/lib/postgresql/data
    restart: unless-stopped
  immich-redis:
    container_name: immich_redis
    image: redis:6.2-alpine
    restart: unless-stopped
volumes:
  model-cache: null
