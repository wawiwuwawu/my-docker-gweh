services:
  ghost:
    image: ghost:5-alpine
    restart: unless-stopped
    ports:
    - 8087:2368
    environment:
      url: ${GHOST_URL:-http://localhost:8087}
      storage__active: s3
      storage__s3__accessKeyId: ${S3_ACCESS_KEY_ID:-ghost-media}
      storage__s3__secretAccessKey: ${storage__s3__secretAccessKey}
      storage__s3__region: us-east-1
      storage__s3__bucket: ghost-media
      storage__s3__endpoint: ${S3_ENDPOINT:-http://host.docker.internal:9020}
      storage__s3__assetHost: ${S3_ASSET_HOST:-http://localhost:9020/ghost-media}
      storage__s3__forcePathStyle: 'true'
      mail__transport: SMTP
      mail__options__service: Gmail
      mail__options__host: smtp.gmail.com
      mail__options__port: 587
      mail__options__secure: 'false'
      mail__options__auth__user: ${MAIL_USER:-mail@example.com}
      mail__options__auth__pass: ${mail__options__auth__pass}
      mail__from: ${MAIL_FROM:-Ghost <mail@example.com>}
      database__client: mysql
      database__connection__host: db
      database__connection__user: ghost_user
      database__connection__password: ${database__connection__password}
      database__connection__database: ghost_data
    volumes:
    - ./content:/var/lib/ghost/content
    depends_on:
    - db
  db:
    image: mysql:8.0
    restart: unless-stopped
    ports:
    - 127.0.0.1:3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ghost_data
      MYSQL_USER: ghost_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
    - ./db-data:/var/lib/mysql
