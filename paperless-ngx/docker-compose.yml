services:
  broker:
    image: docker.io/library/redis:7
    restart: unless-stopped
    volumes:
    - redisdata:/data
  db:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    volumes:
    - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  gotenberg:
    image: docker.io/gotenberg/gotenberg:8
    restart: unless-stopped
    command:
    - gotenberg
    - --chromium-disable-javascript=true
    - --chromium-allow-list=file:///tmp/.*
  tika:
    image: docker.io/apache/tika:4.2.0
    restart: unless-stopped
  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:3.4.2
    restart: unless-stopped
    depends_on:
    - broker
    - db
    - gotenberg
    - tika
    ports:
    - 8057:8000
    volumes:
    - ${PAPERLESS_DATA_DIR:-./data/data}:/usr/src/paperless/data
    - ${PAPERLESS_MEDIA_DIR:-./data/media}:/usr/src/paperless/media
    - ${PAPERLESS_EXPORT_DIR:-./data/export}:/usr/src/paperless/export
    - ${PAPERLESS_CONSUME_DIR:-./data/consume}:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DBPASS}
      PAPERLESS_OCR_LANGUAGES: ind
      PAPERLESS_OCR_LANGUAGE: ind+eng
      PAPERLESS_TIME_ZONE: ${TZ:-Asia/Jakarta}
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
volumes:
  pgdata: null
  redisdata: null
