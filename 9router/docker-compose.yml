services:
  9router:
    image: decolua/9router:0.5.116
    container_name: 9router
    ports:
    - 20128:20128
    volumes:
    - ./data:/app/data
    environment:
    - DATA_DIR=/app/data
    - PORT=20128
    - HOSTNAME=0.0.0.0
    - INITIAL_PASSWORD=${INITIAL_PASSWORD}
    - JWT_SECRET=${JWT_SECRET}
    restart: unless-stopped
