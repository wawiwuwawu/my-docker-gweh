# Reconstructed from `docker inspect` — this container was started with `docker run`,
# there was no compose file on the host. The original bind mounts were
# /opt/homepage/config (config) and /var/run/docker.sock (read-only); they are
# relative here so the stack can be cloned anywhere.
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3090:3000"
    environment:
      # comma-separated host:port values the dashboard is allowed to answer on
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-localhost:3090}
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
