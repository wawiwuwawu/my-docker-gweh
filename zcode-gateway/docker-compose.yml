services:
  zcode-gateway:
    build: .
    image: zcode-gateway:local
    container_name: zcode-gateway
    restart: unless-stopped
    ports:
    - 0.0.0.0:20131:20131
    env_file:
    - path: .env
      required: false
    environment:
    - PORT=20131
    - HOST=0.0.0.0
    - ZCODE_DEFAULT_EFFORT=low
    - ZCODE_STATE_DIR=/app/data
    - ZCODE_ACCOUNTS_FILE=/app/data/accounts.json
    - ZCODE_PLAN_JWT_FILE=/app/data/plan-jwt.json
    - ZCODE_IDENTITY_PLATFORM=linux
    - ZCODE_IDENTITY_DEVICE_MID=${ZCODE_IDENTITY_DEVICE_MID}
    - ZCODE_IDENTITY_OS_VERSION=debian
    - TZ=${TZ:-Asia/Jakarta}
    volumes:
    - ./data:/app/data
