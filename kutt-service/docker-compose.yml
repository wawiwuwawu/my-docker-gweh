services:
  kutt:
    image: kutt/kutt:v3.2.6
    container_name: kutt-service
    restart: unless-stopped
    volumes:
    - db_data_sqlite:/var/lib/kutt
    - custom:/kutt/custom
    environment:
    - DB_DRIVER=sqlite
    - DB_FILENAME=/var/lib/kutt/data.sqlite
    - REDIS_ENABLED=true
    - REDIS_HOST=kutt-redis
    - REDIS_PORT=6379
    - JWT_SECRET=${JWT_SECRET}
    - DEFAULT_DOMAIN=${DEFAULT_DOMAIN:-localhost:3003}
    - DISALLOW_REGISTRATION=false
    - ADMIN_EMAILS=${ADMIN_EMAILS:-admin@example.com}
    ports:
    - 3003:3000
    depends_on:
    - kutt-redis
  kutt-redis:
    image: redis:7-alpine
    container_name: kutt-redis
    restart: unless-stopped
    expose:
    - 6379
volumes:
  db_data_sqlite: null
  custom: null
